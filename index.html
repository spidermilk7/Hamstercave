<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shared Pantry</title>
  <style>
    body { font: 16px system-ui, sans-serif; max-width: 700px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    input, button { font: inherit; padding: .65rem; margin: .25rem 0; }
    button { cursor: pointer; }
    form { display: flex; flex-wrap: wrap; gap: .4rem; }
    input { min-width: 120px; }
    #scanner { width: 100%; max-height: 300px; background: #111; }
    li { margin: .7rem 0; }
    .muted { color: #555; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <h1>Shared Pantry</h1>

  <section id="loginPanel">
    <p>Sign in with the email and password for the account you created.</p>
    <form id="loginForm">
      <input id="email" type="email" placeholder="Email" autocomplete="username" required>
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
  </section>

  <main id="appPanel" hidden>
    <button id="signOutButton">Sign out</button>
    <button id="refreshButton">Refresh inventory</button>
    <button id="importButton">Import this phone’s old inventory</button>

    <p id="status" class="muted">Ready.</p>

    <button id="startScan">Start camera scanner</button>
    <button id="stopScan" disabled>Stop scanner</button>
    <video id="scanner" playsinline hidden></video>

    <form id="barcodeForm">
      <input id="barcodeInput" placeholder="Barcode" inputmode="numeric" required>
      <button type="submit">Use barcode</button>
    </form>

    <h2>Add or restock an item</h2>
    <form id="itemForm">
      <input id="nameInput" placeholder="Item name" required>
      <input id="newBarcodeInput" placeholder="Barcode" required>
      <input id="quantityInput" type="number" min="1" value="1" required>
      <button type="submit">Add quantity</button>
    </form>

    <h2>Food storage</h2>
    <ul id="inventory"></ul>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://fbizspjnzpwzemwkbcxb.supabase.co";
    const SUPABASE_KEY = "sb_publishable_GoLYKSn9jlP22Nvq_v4cJQ_7Jl6Pw0U";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let inventory = [];
    let stream = null;
    let detector = null;
    let scanLock = false;

    const status = document.querySelector("#status");
    const video = document.querySelector("#scanner");

    function setStatus(message) {
      status.textContent = message;
    }

    function showSignedIn(signedIn) {
      document.querySelector("#loginPanel").hidden = signedIn;
      document.querySelector("#appPanel").hidden = !signedIn;
    }

    async function loadInventory() {
      const { data, error } = await db
        .from("pantry_items")
        .select("barcode, name, quantity")
        .order("name");

      if (error) {
        setStatus("Could not load inventory: " + error.message);
        return;
      }

      inventory = data || [];
      render();
      setStatus("Inventory synced.");
    }

    function render() {
      const list = document.querySelector("#inventory");
      list.replaceChildren();

      if (!inventory.length) {
        const empty = document.createElement("li");
        empty.textContent = "No items yet.";
        list.append(empty);
        return;
      }

      for (const item of inventory) {
        const row = document.createElement("li");
        const label = document.createElement("span");
        label.textContent = `${item.name} — ${item.quantity} (barcode ${item.barcode}) `;

        const useButton = document.createElement("button");
        useButton.textContent = "Use one";
        useButton.onclick = () => useItem(item.barcode);

        const addButton = document.createElement("button");
        addButton.textContent = "Add one";
        addButton.onclick = () => changeQuantity(item.barcode, 1);

        const deleteButton = document.createElement("button");
        deleteButton.textContent = "Delete";
        deleteButton.onclick = async () => {
          if (!confirm(`Delete ${item.name} from the shared pantry?`)) return;
          const { error } = await db.from("pantry_items").delete().eq("barcode", item.barcode);
          if (error) setStatus("Delete failed: " + error.message);
          else await loadInventory();
        };

        row.append(label, useButton, addButton, deleteButton);
        list.append(row);
      }
    }

    async function changeQuantity(barcode, amount) {
      const item = inventory.find(x => x.barcode === barcode);
      if (!item) return;

      const quantity = item.quantity + amount;
      if (quantity < 0) {
        setStatus(`${item.name} is already at zero.`);
        return;
      }

      const { error } = await db
        .from("pantry_items")
        .update({ quantity, updated_at: new Date().toISOString() })
        .eq("barcode", barcode);

      if (error) setStatus("Update failed: " + error.message);
      else await loadInventory();
    }

    async function useItem(barcode) {
      const item = inventory.find(x => x.barcode === barcode);
      if (!item) {
        setStatus("That barcode isn't in the pantry yet. Add the item below first.");
        return;
      }
      await changeQuantity(barcode, -1);
    }

    document.querySelector("#loginForm").addEventListener("submit", async event => {
      event.preventDefault();
      const email = document.querySelector("#email").value.trim();
      const password = document.querySelector("#password").value;

      const { error } = await db.auth.signInWithPassword({ email, password });
      if (error) setStatus("Sign-in failed: " + error.message);
    });

    document.querySelector("#signOutButton").onclick = async () => {
      stopScanner();
      await db.auth.signOut();
      showSignedIn(false);
    };

    document.querySelector("#refreshButton").onclick = loadInventory;

    document.querySelector("#itemForm").addEventListener("submit", async event => {
      event.preventDefault();

      const name = document.querySelector("#nameInput").value.trim();
      const barcode = document.querySelector("#newBarcodeInput").value.trim();
      const quantity = Number(document.querySelector("#quantityInput").value);
      if (!name || !barcode || !Number.isInteger(quantity) || quantity < 1) return;

      const existing = inventory.find(x => x.barcode === barcode);
      const item = {
        barcode,
        name,
        quantity: quantity + (existing ? existing.quantity : 0),
        updated_at: new Date().toISOString()
      };

      const { error } = await db.from("pantry_items").upsert(item, { onConflict: "barcode" });
      if (error) {
        setStatus("Could not save item: " + error.message);
        return;
      }

      event.target.reset();
      document.querySelector("#quantityInput").value = 1;
      setStatus(`Saved ${name}.`);
      await loadInventory();
    });

    document.querySelector("#barcodeForm").addEventListener("submit", async event => {
      event.preventDefault();
      const barcode = document.querySelector("#barcodeInput").value.trim();
      if (barcode) await useItem(barcode);
      document.querySelector("#barcodeInput").value = "";
    });

    document.querySelector("#importButton").onclick = async () => {
      const oldInventory = JSON.parse(localStorage.getItem("pantry-inventory-v1") || "{}");
      const rows = Object.entries(oldInventory).map(([barcode, item]) => ({
        barcode,
        name: item.name,
        quantity: Number(item.quantity) || 0
      })).filter(item => item.name && item.quantity >= 0);

      if (!rows.length) {
        setStatus("No old inventory was found in this browser.");
        return;
      }

      if (!confirm(`Import ${rows.length} item types into the shared pantry? Existing matching barcodes will be replaced.`)) return;

      const { error } = await db.from("pantry_items").upsert(rows, { onConflict: "barcode" });
      if (error) setStatus("Import failed: " + error.message);
      else {
        setStatus(`Imported ${rows.length} item types.`);
        await loadInventory();
      }
    };

    document.querySelector("#startScan").onclick = async () => {
      if (!("BarcodeDetector" in window)) {
        setStatus("Camera barcode scanning isn't supported in this browser. Type the barcode instead.");
        return;
      }

      try {
        detector = new BarcodeDetector({
          formats: ["ean_13", "ean_8", "upc_a", "upc_e", "code_128"]
        });
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" }
        });
        video.srcObject = stream;
        video.hidden = false;
        await video.play();

        document.querySelector("#startScan").disabled = true;
        document.querySelector("#stopScan").disabled = false;
        setStatus("Point the camera at a barcode.");
        scanFrame();
      } catch (error) {
        setStatus("Couldn't start camera: " + error.message);
      }
    };

    async function scanFrame() {
      if (!stream) return;
      try {
        const codes = await detector.detect(video);
        if (codes.length && !scanLock) {
          scanLock = true;
          const barcode = codes[0].rawValue;
          document.querySelector("#barcodeInput").value = barcode;
          await useItem(barcode);
          setTimeout(() => { scanLock = false; }, 1800);
        }
      } catch (error) {
        setStatus("Couldn't read the barcode. Try adjusting the camera.");
      }
      if (stream) requestAnimationFrame(scanFrame);
    }

    document.querySelector("#stopScan").onclick = stopScanner;

    function stopScanner() {
      if (stream) stream.getTracks().forEach(track => track.stop());
      stream = null;
      video.srcObject = null;
      video.hidden = true;
      document.querySelector("#startScan").disabled = false;
      document.querySelector("#stopScan").disabled = true;
    }

    db.auth.onAuthStateChange((_event, session) => {
      const signedIn = Boolean(session);
      showSignedIn(signedIn);
      if (signedIn) loadInventory();
      else stopScanner();
    });

    db.auth.getSession().then(({ data }) => {
      const signedIn = Boolean(data.session);
      showSignedIn(signedIn);
      if (signedIn) loadInventory();
    });

    // Check for updates made from another phone.
    setInterval(() => {
      if (!document.querySelector("#appPanel").hidden) loadInventory();
    }, 10000);
  </script>
</body>
</html>
